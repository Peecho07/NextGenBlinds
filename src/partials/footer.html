<footer class="site-footer">
  <div class="wrap">
    <div class="grid">
      <div>
        <p class="brand-mark" style="font-size:22px;margin-bottom:12px">NextGen <span>Blinds</span></p>
        <p>Custom window treatments for homes across {{serviceArea}}.</p>
      </div>
      <div>
        <h2>Products</h2>
        <ul>{{footerProducts}}</ul>
      </div>
      <div>
        <h2>Company</h2>
        <ul>{{footerCompany}}</ul>
      </div>
      <div>
        <h2>Contact</h2>
        <ul>
          <li><a href="tel:{{phoneE164}}">{{phone}}</a></li>
          <li><a href="mailto:{{email}}">{{email}}</a></li>
        </ul>
        <p style="margin-top:12px">Serving {{serviceArea}}</p>
      </div>
    </div>
    <div class="legal">
      <span>&copy; {{year}} {{name}}{{legalName}}</span>
      <span>{{footerLegal}}</span>
    </div>
  </div>
</footer>
