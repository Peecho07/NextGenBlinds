<div class="util">
  <div class="wrap">
    <span>Serving {{serviceArea}}</span>
    <div class="util-right">{{social}}<a href="tel:{{phoneE164}}">{{phone}}</a></div>
  </div>
</div>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/" aria-label="{{name}} home"><img src="/assets/img/logo.png" alt="{{name}}" width="300" height="61"></a>
    <nav class="nav" aria-label="Main">
      <ul>{{nav}}</ul>
    </nav>
    <div class="hdr-actions">
      <a class="hdr-phone" href="tel:{{phoneE164}}">{{phone}}</a>
      <a class="btn btn-primary" href="/contact-us/">Request a Free Consultation</a>
      <button class="menu-btn" type="button" aria-expanded="false" aria-controls="mobile-nav"><span class="bars"><span></span></span><span class="menu-label">Menu</span></button>
    </div>
  </div>
  <nav class="mobile-nav" id="mobile-nav" aria-label="Mobile">
    <ul>{{mobileNav}}</ul>
    <div class="wrap" style="padding-bottom:24px">
      <a class="btn btn-primary" href="/contact-us/">Request a Free Consultation</a>
      <a class="btn btn-secondary" href="tel:{{phoneE164}}">Call {{phone}}</a>
    </div>
  </nav>
</header>
